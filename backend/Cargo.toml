[package]
name = "niulai"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[[bin]]
name = "niulai"
path = "src/bin/niulai.rs"

[dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace", "timeout", "request-id", "fs", "set-header", "compression-gzip"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "chrono", "rust_decimal"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "decimal"] }
utoipa-axum = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
parquet = { version = "60", default-features = false, features = ["zstd", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43", features = ["serde-str"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
config = { version = "0.15", default-features = false }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.13"
sha2 = "0.11"
argon2 = "0.6"
getrandom = "0.4"
async-trait = "0.1"
redis = { version = "0.32.7", default-features = false, features = ["tokio-comp", "connection-manager", "json"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
debug = "line-tables-only"
