    params: {thscode: "{thscode}", start_date: "{today}", end_date: "{today+60d}"}
    records: data
    key: "{_part.thscode}"
    schedule: weekly

  # 不同步：/api/futures/contracts/detail（与 futures.contracts 重复）、/api/futures/prices/intraday（只有当日分时）、
  #         /api/futures/calendar/session-timeline（只有当日时间轴）、/api/futures/positions/contract-historical（需要按公司 × 合约查询，组合太多，按需调用）

  # ═══════════════════════════ 期权（P2） ═══════════════════════════

  - id: options.varieties
    endpoint: /api/options/varieties/list
    priority: P2
    partition: once
    records: data.item
    key: "{variety_code}"
    schedule: weekly
    notes: 88 个品种。

  - id: options.contracts
    endpoint: /api/options/contracts/list
    priority: P2
    partition: once
    paging: {offset: {limit_param: limit, offset_param: offset, size: 1000}}
    records: data.item
    key: "{thscode}"
    thscode: "{thscode}"
    schedule: daily
    notes: 超过 1 万个合约。

  - id: options.contract_detail
    endpoint: /api/options/contracts/detail
    priority: P3
    partition: {security: {universe: "dataset_id = 'options.contracts' AND active"}}
    params: {thscode: "{thscode}"}
    records: data
    key: "{thscode}"
    schedule: weekly
    notes: 行权价、认购/认沽、标的、行权方式；列表接口没有这些字段。

  - id: options.bar_1d
    endpoint: /api/options/prices/daily
    priority: P3
    partition: {security: {universe: "dataset_id = 'options.contracts' AND active"}}
    params: {thscode: "{thscode}", time_period: day_1}
    records: data.item
    key: "{_part.thscode}|{timestamp:date}"
    obs_date: "{timestamp:date}"
    incremental: {since_cursor: {overlap_days: 3}}
    notes: 默认最近 100 根。合约超过 1 万个，按需限定标的。

  # ═══════════════════════════ 港股新股（P3） ═══════════════════════════

  - id: hk_ipo.applications
    endpoint: /api/hk-share/ipo/application-list
    priority: P3
    partition: once
    paging: {page: {page_param: page, size: 50}}
    records: data.item
    key: "{company_name}|{application_date}"
    schedule: daily

  - id: hk_ipo.calendar
    endpoint: /api/hk-share/ipo/calendar-list
    priority: P3
    partition: {enum: {status: [subscribable, awaiting_listing]}}
    params: {status: "{status}"}
    records: data.item
    key: "{issue_code}"
    schedule: daily

  - id: hk_ipo.issue_detail
    endpoint: /api/hk-share/ipo/issue-detail
    priority: P3
    partition: {from_dataset: {dataset: hk_ipo.calendar, fields: {issue_code: rkey}}}
    params: {issue_code: "{issue_code}"}
    records: data
    key: "{issue_code}"
    schedule: daily

