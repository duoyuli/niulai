# niulai 部署：在任何装有 Docker 的服务器上，用 GitHub 镜像仓库里的镜像一键启动。
#
#   ./install.sh          # 首次安装：生成 .env，启动，等待就绪，规划首次回补
#   ./upgrade.sh          # 升级：先备份，再拉取新镜像并重启
#   ./backup.sh           # 备份数据库到 backups/
#
# 所有配置都在同目录的 .env 中（模板 .env.example，由 install.sh 生成）。服务按 COMPOSE_PROFILES 启用：
#   db     内置 PostgreSQL；已有数据库时去掉，并在 .env 中填 DATABASE_URL
#   proxy  Caddy 反向代理：自动申请 HTTPS 证书，用户名密码登录；不对公网开放时去掉，用 SSH 隧道访问
# 说明见 docs/operations/runbook.md#deployment。
name: niulai

x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: "5" }

services:
  postgres:
    image: postgres:18.6
    profiles: [db]
    environment:
      POSTGRES_USER: niulai
      POSTGRES_DB: niulai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}     # install.sh 随机生成；为空时数据库拒绝启动
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=2GB"]
    volumes: [pgdata:/var/lib/postgresql]
    restart: unless-stopped
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "niulai", "-d", "niulai"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  niulai:
    image: ${NIULAI_IMAGE:?在 .env 中设置 NIULAI_IMAGE}
    command: ["niulai", "serve"]
    env_file: .env
    depends_on:
      # 没有启用 db 时（使用外部数据库）不等待
      postgres: { condition: service_healthy, required: false }
    # 只监听本机：公网经 Caddy 访问，或用 SSH 隧道 ssh -L 8080:127.0.0.1:8080 <服务器>
    ports: ["127.0.0.1:${NIULAI_PORT:-8080}:8080"]
    restart: unless-stopped
    stop_grace_period: 2m      # 停机时等正在执行的任务结束
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  caddy:
    image: caddy:2.11.6
    profiles: [proxy]
    environment:
      NIULAI_DOMAIN: ${NIULAI_DOMAIN:-}             # 启用 proxy 时必填
    ports:
      - "${NIULAI_HTTP_PORT:-80}:80"
      - "${NIULAI_HTTPS_PORT:-443}:443"
      - "${NIULAI_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/auth.caddy:/etc/caddy/auth.caddy:ro    # 登录用户名和密码哈希，由 install.sh 生成
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [niulai]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
