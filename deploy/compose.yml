# niulai 的 Docker 部署（默认方式）：使用 CI 构建好的镜像，运行 PostgreSQL 和 niulai 两个容器。
# 对外只暴露 niulai 的 HTTP 端口（默认 127.0.0.1:8080）；HTTPS、域名和登录由前面的反向代理负责。
#
#   cp .env.example .env     # 填写 .env，说明见文件内
#   docker compose up -d     # 在本目录执行；之后打开网页，按引导配置 API Key
#
# 从源码构建镜像（不使用镜像仓库）时，叠加 compose.source.yml，见那个文件开头。
# 升级、备份、恢复见 docs/operations/runbook.md#deployment。
name: niulai

x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: "5" }

services:
  # 内置数据库（profile db）。用已有的 PostgreSQL 时，在 .env 中去掉 db 并填写 DATABASE_URL
  postgres:
    image: postgres:18.6
    profiles: [db]
    environment:
      POSTGRES_USER: niulai
      POSTGRES_DB: niulai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=2GB"]
    volumes: [pgdata:/var/lib/postgresql]
    restart: unless-stopped
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "niulai", "-d", "niulai"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  niulai:
    image: ${NIULAI_IMAGE:-ghcr.io/duoyuli/niulai:latest}
    command: ["niulai", "serve"]
    env_file: .env
    environment:
      # 默认连内置数据库；.env 中设置了 DATABASE_URL 时用它
      DATABASE_URL: ${DATABASE_URL:-postgres://niulai:${POSTGRES_PASSWORD:-}@postgres:5432/niulai}
    depends_on:
      postgres: { condition: service_healthy, required: false }
    # 对外只有这一个 HTTP 端口：页面 /，接口 /api/v1/*，健康检查 /api/v1/health、/api/v1/ready。
    # 默认只监听本机，由同机的反向代理（例如 Nginx）转发；HTTPS、登录、访问控制都在反向代理上做
    ports: ["${NIULAI_LISTEN:-127.0.0.1:8080}:8080"]
    restart: unless-stopped
    stop_grace_period: 2m      # 停机时等正在执行的任务结束
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

volumes:
  pgdata:
