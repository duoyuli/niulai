# niulai 的 Docker 部署：使用 CI 构建好的镜像，运行内置 PostgreSQL 和 niulai 两个容器。
# 对外只暴露 niulai 的一个 HTTP 端口，页面和 API 都在这个端口上。全部配置在同目录的 .env 中。
#
#   cp .env.example .env     # 默认值可以直接使用，按需修改端口等
#   docker compose up -d     # 之后打开网页，按引导配置 API Key
#
# 使用本机构建的镜像时，在 .env 中把 NIULAI_IMAGE 改成那个镜像（构建命令见 Dockerfile 开头）。
# 不用 Docker、直接编译运行的方式见 docs/operations/runbook.md#source_deploy；升级、备份、恢复见同一文档的「部署」一节。
name: niulai

x-logging: &logging
  driver: json-file
  options: { max-size: 20m, max-file: "5" }

services:
  # 内置数据库：端口不对外暴露，只有 niulai 容器能连接。
  # 数据放在 .env 的 POSTGRES_DATA（默认部署目录下的 data/postgres）：宿主机上的普通目录，删除容器、docker compose down -v、
  # docker volume prune 都不影响。见 docs/operations/runbook.md#data_dir
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: niulai
      POSTGRES_DB: niulai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niulai}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=2GB"]
    volumes: ["${POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql"]
    restart: unless-stopped
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "niulai", "-d", "niulai"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  niulai:
    image: ${NIULAI_IMAGE:-ghcr.io/duoyuli/niulai:latest}
    command: ["niulai", "serve"]
    # .env 中的 DATABASE_URL、NIULAI_* 等变量传给 niulai
    env_file: .env
    environment:
      NIULAI_UPGRADE_DIR: /upgrade
    # 与 upgrader 共享：niulai 在这里写「要升级到的版本号」，upgrader 写进度
    volumes: [upgrade:/upgrade]
    depends_on:
      postgres: { condition: service_healthy }
    # 对外只有这一个 HTTP 端口：页面 /，接口 /api/v1/*，健康检查 /api/v1/health、/api/v1/ready。
    # 打开网页先要登录（.env 中的 NIULAI_ADMIN_USER、NIULAI_ADMIN_PASSWORD）；默认只监听本机
    ports: ["${NIULAI_LISTEN_ADDR:-127.0.0.1}:${NIULAI_PORT:-8080}:8080"]
    restart: unless-stopped
    stop_grace_period: 2m      # 停机时等正在执行的任务结束
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  # 一键升级助手：网页上点「一键升级」后，由它备份内置数据库、拉取新镜像并重建 niulai 容器（niulai upgrader）。
  # 它挂载 Docker 的控制接口，能管理这台机器上的容器；niulai 没有这个权限，只能通过共享卷 upgrade 提交一个版本号。
  # .env 中的 COMPOSE_PROFILES=upgrader 启用它，删掉这一行即可关闭一键升级
  upgrader:
    image: ${NIULAI_IMAGE:-ghcr.io/duoyuli/niulai:latest}
    profiles: [upgrader]
    command: ["niulai", "upgrader"]
    user: root                 # 访问 Docker 的控制接口需要 root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy             # 改写 .env 中的 NIULAI_IMAGE，备份写到 backups/
      - upgrade:/upgrade
    restart: unless-stopped
    logging: *logging

volumes:
  # 一键升级时 niulai 和 upgrader 交换的临时文件（升级请求、进度、心跳），丢了也没关系，所以用卷
  upgrade:
