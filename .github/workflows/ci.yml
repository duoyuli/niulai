# CI：每次 PR 和推送都检查代码；main 分支有合并、或推送 v* 标签时，再构建镜像并推送到 GitHub 镜像仓库。
#
# - check：后端 clippy（不允许警告）、单元测试和集成测试（用临时 PostgreSQL）；前端类型检查、代码检查、测试
# - build：检查通过后，amd64 和 arm64 分别在对应架构的机器上原生构建（模拟另一种架构编译 Rust 要慢很多倍）
# - merge：合并成一个多架构镜像 ghcr.io/<仓库所有者，小写>/niulai，并打标签：
#     推送到 main     → latest、sha-<提交>
#     推送 v0.1.0 标签 → 0.1.0、0.1、sha-<提交>（git tag v0.1.0 && git push origin v0.1.0）
# 部署（CD）见 deploy/ 和 docs/operations/runbook.md#deployment。
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Rust 工具链（按 backend/rust-toolchain.toml）
        working-directory: backend
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: 后端：clippy
        working-directory: backend
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: 后端：单元测试和集成测试
        working-directory: backend
        env:
          NIULAI_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 前端：安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 前端：类型检查、代码检查、测试
        working-directory: frontend
        run: pnpm typecheck && pnpm lint && pnpm test

  build:
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 镜像名（GHCR 要求小写）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/niulai" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # 只按摘要推送，标签在 merge 中统一打
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: 记录摘要
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: 镜像名（GHCR 要求小写）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/niulai" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: 合并多架构镜像并打标签
        working-directory: /tmp/digests
        run: |
          # 标签和摘要都要拆成多个参数，所以不加引号
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: 检查
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
